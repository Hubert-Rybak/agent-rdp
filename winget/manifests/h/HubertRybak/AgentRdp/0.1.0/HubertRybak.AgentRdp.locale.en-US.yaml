License: MIT
LicenseUrl: https://github.com/Hubert-Rybak/agent-rdp/blob/master/LICENSE
ShortDescription: Windows-to-Windows RDP command execution bridge for AI agents
Description: >-
  agent-rdp drives cmd/PowerShell on a remote Windows RDP host from a
  Windows client, using RDP's native Alternate Shell feature and a Dynamic
  Virtual Channel. No extra management port is opened, and no files are
  persisted on the target host's disk. Ships a single-command "pipe mode"
  with separated stdout/stderr and an exit code, intended for an AI agent
  or script to invoke as a tool.
