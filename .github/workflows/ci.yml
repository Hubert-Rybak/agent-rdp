name: CI

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-check:
    name: Python syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Compile-check the launcher
        run: python -m py_compile src/launcher/agent_rdp.py

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run launcher unit tests
        run: python -m pytest tests/ -q

  windows-build:
    name: Windows build (plugin DLL + bridge EXE)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Native components require FreeRDP built for Windows via vcpkg, which
      # is the slow part of this job -- cache it across runs.
      - name: Cache vcpkg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .vcpkg
            vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'triplets/*.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Filter "*.ps1" -File | ForEach-Object {
            $scriptName = $_.Name
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($parseError in $errors) {
              Write-Error "${scriptName}: $($parseError.Message)"
              $failed = $true
            }
          }
          if ($failed) { throw "PowerShell syntax validation failed" }

      - name: Build agent-rdp-client.dll + agent-rdp-bridge.exe
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Smoke-test Authenticode signing helper
        timeout-minutes: 5
        shell: pwsh
        run: |
          $temporaryDirectory = Join-Path $env:RUNNER_TEMP "agent-rdp-signing-smoke"
          $pfxPath = Join-Path $temporaryDirectory "smoke.pfx"
          $cerPath = Join-Path $temporaryDirectory "smoke.cer"
          $artifactCopy = Join-Path $temporaryDirectory "artifacts"
          $certificate = $null
          $thumbprint = $null
          $passwordText = [Guid]::NewGuid().ToString("N")
          $securePassword = ConvertTo-SecureString $passwordText -AsPlainText -Force
          New-Item -ItemType Directory -Path $artifactCopy -Force | Out-Null

          Write-Host "::notice title=agent-rdp signing smoke::Preparing ephemeral signing certificate"
          $certificate = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=agent-rdp CI signing smoke" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddDays(1)
          $thumbprint = $certificate.Thumbprint
          $certificateStorePath = "Cert:\CurrentUser\My\$thumbprint"

          try {
            Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $securePassword | Out-Null
            Export-Certificate -Cert $certificate -FilePath $cerPath | Out-Null
            Import-Certificate -FilePath $cerPath -CertStoreLocation "Cert:\CurrentUser\Root" | Out-Null
            $certificate.Dispose()
            $certificate = $null
            Remove-Item -LiteralPath $certificateStorePath -DeleteKey -Force

            Copy-Item artifacts/agent-rdp-bridge.exe, artifacts/agent-rdp-client.dll -Destination $artifactCopy
            $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD = $passwordText
            Write-Host "::notice title=agent-rdp signing smoke::Invoking bounded signing helper"
            ./scripts/sign-artifacts.ps1 `
              -CertificatePath $pfxPath `
              -ArtifactsDirectory $artifactCopy `
              -SkipTimestamp `
              -SignToolTimeoutSeconds 60
            Write-Host "::notice title=agent-rdp signing smoke::Signing helper completed"

            $importedCertificatePath = "Cert:\CurrentUser\My\$thumbprint"
            if (Test-Path $importedCertificatePath) {
              throw "Signing helper left its imported certificate in CurrentUser\\My"
            }
          }
          finally {
            Remove-Item Env:\WINDOWS_SIGNING_CERTIFICATE_PASSWORD -ErrorAction SilentlyContinue
            $passwordText = $null
            if ($securePassword) { $securePassword.Dispose() }
            if ($certificate) {
              $certificate.Dispose()
              $certificate = $null
            }
            foreach ($store in @("My", "Root")) {
              $certificatePath = "Cert:\CurrentUser\$store\$thumbprint"
              if (Test-Path $certificatePath) {
                if ($store -eq "My") {
                  Remove-Item -Path $certificatePath -DeleteKey -Force
                } else {
                  Remove-Item -Path $certificatePath -Force
                }
              }
            }
            if (Test-Path $temporaryDirectory) { Remove-Item -Path $temporaryDirectory -Recurse -Force }
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-rdp-windows-build-unsigned
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
