name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (for example, v0.1.0)"
        required: true
        default: "v0.1.0"

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  # Never abort a partially published release; a duplicate waits for the active run.
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # Required to create or update the GitHub Release.
    steps:
      - name: Resolve release version
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $env:INPUT_VERSION
          } else {
            $env:REF_NAME
          }
          if ($version -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release version must match v<major>.<minor>.<patch>; got '$version'"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select release commit
        id: target
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          function Set-ReleaseCheckout {
            param([Parameter(Mandatory = $true)][string]$Ref)

            git checkout --detach $Ref
            if ($LASTEXITCODE -ne 0) {
              throw "Could not checkout release target '$Ref'"
            }
          }

          $version = $env:RELEASE_VERSION
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            if (git show-ref --verify --quiet "refs/tags/$version") {
              $assetCount = gh release view $version --json assets --jq '.assets | length' 2>$null
              if ($LASTEXITCODE -eq 0 -and [int]$assetCount -eq 0) {
                # Replace an incomplete, asset-less release from the current
                # default-branch commit (this repairs the initial v0.1.0).
                "replace_empty_release=true" >> $env:GITHUB_OUTPUT
              } else {
                Set-ReleaseCheckout -Ref $version
              }
            } else {
              Set-ReleaseCheckout -Ref "origin/$env:DEFAULT_BRANCH"
            }
          }
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve the release commit" }
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller==6.21.0

      - name: Build native components (plugin DLL + bridge EXE + wfreerdp)
        shell: pwsh
        run: ./scripts/build.ps1

      # Freezes the launcher into a standalone agent-rdp.exe so the winget/zip
      # package is self-contained (no separate Python install required).
      # See _default_artifacts_dir() in src/launcher/agent_rdp.py: when frozen,
      # it resolves its companion binaries relative to its own exe directory,
      # so everything below must land flat in the same folder.
      - name: Freeze launcher with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --onefile --name agent-rdp --distpath artifacts --workpath build/pyinstaller --specpath build src/launcher/agent_rdp.py

      - name: Prepare Authenticode signing certificate
        id: signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)
          if ($hasCertificate -xor $hasPassword) {
            throw "Authenticode signing is only partially configured; set both signing secrets or neither"
          }
          if (-not $hasCertificate) {
            Write-Host "::warning::Authenticode signing is not configured. Release PE files will be unsigned."
            "configured=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "agent-rdp-signing.pfx"
          try {
            $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
            [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          } catch {
            throw "WINDOWS_SIGNING_CERTIFICATE_BASE64 is not valid base64: $($_.Exception.Message)"
          }
          "configured=true" >> $env:GITHUB_OUTPUT
          "certificate_path=$certificatePath" >> $env:GITHUB_OUTPUT

      - name: Sign Windows artifacts
        if: steps.signing.outputs.configured == 'true'
        timeout-minutes: 10
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          CERTIFICATE_PATH: ${{ steps.signing.outputs.certificate_path }}
        run: |
          ./scripts/sign-artifacts.ps1 -CertificatePath $env:CERTIFICATE_PATH -ArtifactsDirectory "artifacts"

      - name: Remove temporary signing certificate
        if: always()
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "agent-rdp-signing.pfx"
          if (Test-Path $certificatePath) {
            Remove-Item -Path $certificatePath -Force
          }

      - name: Package release zip
        id: package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $zipName = "agent-rdp-$version-x64.zip"
          $required = @("agent-rdp.exe", "agent-rdp-client.dll", "agent-rdp-bridge.exe", "wfreerdp.exe")
          foreach ($file in $required) {
            if (-not (Test-Path "artifacts/$file" -PathType Leaf)) { throw "Required release file is missing: $file" }
          }
          if (-not (Get-ChildItem artifacts -Filter "*.dll" -File | Where-Object Name -ne "agent-rdp-client.dll")) {
            throw "Release has no FreeRDP/runtime DLLs"
          }
          Compress-Archive -Path artifacts/* -DestinationPath $zipName -Force
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash
          "$($hash.ToLower())  $zipName" | Out-File -Encoding ascii "$zipName.sha256.txt"
          Write-Host "SHA256: $hash"
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          REPLACE_EMPTY_RELEASE: ${{ steps.target.outputs.replace_empty_release }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          $version = $env:RELEASE_VERSION
          $assets = @($env:ZIP_NAME, "$($env:ZIP_NAME).sha256.txt")
          if ($env:REPLACE_EMPTY_RELEASE -eq "true") {
            gh release delete $version --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not remove incomplete release $version" }
          }
          gh release view $version *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $version @assets --clobber
          } else {
            gh release create $version @assets --target $env:TARGET_SHA --title $version --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing release $version failed" }

      - name: Print winget manifest update reminder
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          ZIP_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          Write-Host "Release published. Update the matching winget manifest version."
          Write-Host "  Release tag:    $env:RELEASE_VERSION"
          Write-Host "  InstallerUrl:   https://github.com/$env:REPOSITORY/releases/download/$env:RELEASE_VERSION/$env:ZIP_NAME"
          Write-Host "  InstallerSha256: $env:ZIP_SHA256"
