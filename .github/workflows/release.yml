name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (for example, v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: windows-latest
    concurrency: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Resolve release version
        id: release
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.ref_name }}"
          }
          if ($version -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release version must match v<major>.<minor>.<patch>; got '$version'"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0

      - name: Select release commit
        id: target
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.release.outputs.version }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            if (git show-ref --verify --quiet "refs/tags/$version") {
              $assetCount = gh release view $version --json assets --jq '.assets | length' 2>$null
              if ($LASTEXITCODE -eq 0 -and [int]$assetCount -eq 0) {
                # Replace an incomplete, asset-less release from the current
                # default-branch commit (this repairs the initial v0.1.0).
                "replace_empty_release=true" >> $env:GITHUB_OUTPUT
              } else {
                git checkout --detach $version
              }
            } else {
              git checkout --detach "origin/${{ github.event.repository.default_branch }}"
            }
          }
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve the release commit" }
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg
            vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'triplets/*.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Build native components (plugin DLL + bridge EXE + wfreerdp)
        shell: pwsh
        run: ./scripts/build.ps1

      # Freezes the launcher into a standalone agent-rdp.exe so the winget/zip
      # package is self-contained (no separate Python install required).
      # See _default_artifacts_dir() in src/launcher/agent_rdp.py: when frozen,
      # it resolves its companion binaries relative to its own exe directory,
      # so everything below must land flat in the same folder.
      - name: Freeze launcher with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --onefile --name agent-rdp --distpath artifacts --workpath build/pyinstaller --specpath build src/launcher/agent_rdp.py

      - name: Package release zip
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $zipName = "agent-rdp-$version-x64.zip"
          $required = @("agent-rdp.exe", "agent-rdp-client.dll", "agent-rdp-bridge.exe", "wfreerdp.exe")
          foreach ($file in $required) {
            if (-not (Test-Path "artifacts/$file" -PathType Leaf)) { throw "Required release file is missing: $file" }
          }
          if (-not (Get-ChildItem artifacts -Filter "*.dll" -File | Where-Object Name -ne "agent-rdp-client.dll")) {
            throw "Release has no FreeRDP/runtime DLLs"
          }
          Compress-Archive -Path artifacts/* -DestinationPath $zipName -Force
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash
          "$($hash.ToLower())  $zipName" | Out-File -Encoding ascii "$zipName.sha256.txt"
          Write-Host "SHA256: $hash"
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $assets = @("${{ steps.package.outputs.zip_name }}", "${{ steps.package.outputs.zip_name }}.sha256.txt")
          if ("${{ steps.target.outputs.replace_empty_release }}" -eq "true") {
            gh release delete $version --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not remove incomplete release $version" }
          }
          gh release view $version *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $version @assets --clobber
          } else {
            gh release create $version @assets --target "${{ steps.target.outputs.sha }}" --title $version --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing release $version failed" }

      - name: Print winget manifest update reminder
        shell: pwsh
        run: |
          Write-Host "Release published. Update the matching winget manifest version."
          Write-Host "  Release tag:    ${{ steps.release.outputs.version }}"
          Write-Host "  InstallerUrl:   https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.version }}/${{ steps.package.outputs.zip_name }}"
          Write-Host "  InstallerSha256: ${{ steps.package.outputs.sha256 }}"
